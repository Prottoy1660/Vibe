# Force Node.js — supabase/functions/*.ts imports deno.land and would otherwise
# trigger the Deno provider (build image has no npm).
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
# Vite production build can exceed default Node heap on small Coolify builders.
NODE_OPTIONS = "--max-old-space-size=4096"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "SERVE_STATIC_SPA=1 node --import tsx api/server.ts"
