<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Premium digital accounts management platform" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Access" />
    <meta property="og:title" content="Vibe Access - Digital Marketplace" />
    <meta property="og:description" content="Premium digital accounts management platform" />
    <meta property="og:image" content="https://vibeaccessbd.com/apple-touch-icon.png" />
    <meta property="og:url" content="https://vibeaccessbd.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vibe Access - Digital Marketplace" />
    <meta name="twitter:description" content="Premium digital accounts management platform" />
    <meta name="twitter:image" content="https://vibeaccessbd.com/apple-touch-icon.png" />
    <link rel="canonical" href="https://vibeaccessbd.com/" />
    <title>Vibe Access</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <!-- React mounts the full UI here at runtime. "View page source" only shows this empty div until JS runs. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Update branding client-side (browsers). Social crawlers rely on server-injected meta tags.
      const setMetaContent = (key, value, attrName) => {
        let el = document.querySelector(`meta[${attrName}="${key}"]`);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attrName, key);
          document.head.appendChild(el);
        }
        el.setAttribute('content', value);
      };

      const changeFavicon = (src) => {
        const link = document.createElement('link');
        const oldLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
        oldLinks.forEach(e => e.parentNode.removeChild(e));
        link.id = 'dynamic-favicon';
        link.rel = 'icon';
        link.href = src;
        document.head.appendChild(link);
      };

      const hostname = window.location.hostname.toLowerCase();
      const isSuperReseller =
        hostname === 'superreseller.shop' ||
        hostname === 'www.superreseller.shop' ||
        hostname.includes('superreseller');

      if (isSuperReseller) {
        const origin = window.location.origin;
        const title = document.title.includes('Super Reseller')
          ? document.title
          : 'Super Reseller - Premium Dashboard';
        const description = 'Premium reseller dashboard for managing digital subscriptions';
        const image = origin + '/super.png';
        const pageUrl = window.location.href.split('#')[0];

        document.title = title;
        changeFavicon('/super-favicon.svg');

        const appleTouch = document.createElement('link');
        appleTouch.rel = 'apple-touch-icon';
        appleTouch.href = '/super.png';
        document.head.appendChild(appleTouch);

        setMetaContent('description', description, 'name');
        setMetaContent('application-name', 'Super Reseller', 'name');
        setMetaContent('og:site_name', 'Super Reseller', 'property');
        setMetaContent('og:title', title, 'property');
        setMetaContent('og:description', description, 'property');
        setMetaContent('og:image', image, 'property');
        setMetaContent('og:url', pageUrl, 'property');
        setMetaContent('twitter:title', title, 'name');
        setMetaContent('twitter:description', description, 'name');
        setMetaContent('twitter:image', image, 'name');

        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) {
          manifest.setAttribute('href', '/manifest.superreseller.webmanifest');
        }
      } else {
        document.title = 'Vibe Access - Digital Marketplace';
        changeFavicon('/favicon.png');
      }
    </script>
  </body>
</html>
