<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Premium digital accounts management platform" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>VibeAccess</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <!-- React mounts the full UI here at runtime. "View page source" only shows this empty div until JS runs. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Dynamically update the document title and favicon based on the domain
      const changeFavicon = (src) => {
        const link = document.createElement('link');
        const oldLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
        oldLinks.forEach(e => e.parentNode.removeChild(e));
        link.id = 'dynamic-favicon';
        link.rel = 'icon';
        link.href = src;
        document.head.appendChild(link);
      };

      if (window.location.hostname === 'superreseller.shop' || window.location.hostname.includes('superreseller') || window.location.pathname.startsWith('/reseller')) {
        document.title = 'Super Reseller - Premium Dashboard';
        changeFavicon('/super-favicon.svg');
      } else {
        document.title = 'Vibe Access - Digital Marketplace';
        changeFavicon('/favicon.png');
      }
    </script>
  </body>
</html>
